<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Claw Machine 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#140a2a;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,4,30,.78);z-index:5}
#ov.on{display:flex}
.card{background:#2a1450;border:4px solid #ff4fd8;border-radius:22px;padding:26px 28px;text-align:center;color:#fff;box-shadow:0 0 30px #ff4fd8;max-width:80vw}
.card h1{margin:0 0 8px;font-size:34px;color:#ffe14a;text-shadow:0 0 12px #ff9f1a}
.card p{margin:0 0 18px;font-size:17px}
.card button{font:800 20px system-ui;padding:12px 26px;border-radius:14px;border:3px solid #1a0a33;background:#3dff9a;color:#1a0a33;cursor:pointer}
</style></head><body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W=0,H=0,DPR=1,L={};
const OL='#1a0a33';
// ---------- layout ----------
function resize(){DPR=Math.min(3,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);
  const bw=Math.min(W*0.96,H*0.62),bx=(W-bw)/2,mq=Math.max(54,H*0.09),top=mq+12,shelfH=Math.max(70,H*0.11),ctrlH=Math.max(120,H*0.17);
  const gb=H-shelfH-ctrlH-10;
  L={bx,bw,mq,top,gb,shelfH,ctrlH,ctrlY:gb+8,shelfY:H-shelfH};
  L.joy={x:bx+ctrlH*0.62,y:L.ctrlY+ctrlH/2,r:Math.min(ctrlH*0.38,70)};
  L.btn={x:bx+bw-ctrlH*0.62,y:L.ctrlY+ctrlH/2-8,r:Math.min(ctrlH*0.34,60)};
  fitCam();}
// ---------- 3D camera ----------
const CAM={e:[0,2.7,4.8],t:[0,0.95,0]},CW=1.1,CD=1.0,CHT=2.5; // cabinet half-width, half-depth, height
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],nrm=a=>{const l=Math.hypot(...a);return[a[0]/l,a[1]/l,a[2]/l];},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const F=nrm(sub(CAM.t,CAM.e)),R=nrm(cross(F,[0,1,0])),U=cross(R,F);let PF=1,PX=0,PY=0;
function pr(x,y,z){const d=[x-CAM.e[0],y-CAM.e[1],z-CAM.e[2]],zz=dot(d,F);return{x:PX+dot(d,R)/zz*PF,y:PY-dot(d,U)/zz*PF,z:zz,k:PF/zz};}
function fitCam(){PF=1;PX=0;PY=0;let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const x of[-CW,CW])for(const y of[0,CHT])for(const z of[-CD,CD]){const p=pr(x,y,z);x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);}
  const vw=L.bw-24,vh=L.gb-L.top-10;PF=Math.min(vw/(x1-x0),vh/(y1-y0));PX=L.bx+L.bw/2-(x0+x1)/2*PF;PY=L.top+6+vh/2-(y0+y1)/2*PF;}
addEventListener('resize',resize);
// ---------- world ----------
const CHUTE={x:-0.74,z:0.64,w:0.3},BIN=0.2,LIGHT=nrm([-0.4,1,0.6]);
const rnd=(a,b)=>a+Math.random()*(b-a);
let balls=[],toy=null,shelf=[],msg='',msgT=0,wins=0,credits=50;
function inChute(x,z,m){return Math.abs(x-CHUTE.x)<CHUTE.w+m&&Math.abs(z-CHUTE.z)<CHUTE.w+m;}
function setupBalls(){balls=[];const cols=['#ff3b5c','#ffd23a','#3dd6ff','#3dff9a','#ff8a1f','#c66bff','#ffffff'];let i=0;
  for(let l=0;l<2;l++)for(let x=-CW+0.1;x<CW-0.05;x+=0.17)for(let z=-CD+0.1;z<CD-0.05;z+=0.17){const bx=x+rnd(-.03,.03)+(l?.08:0),bz=z+rnd(-.03,.03)+(l?.08:0);if(inChute(bx,bz,.12)||Math.abs(bx)>CW-.08||Math.abs(bz)>CD-.08)continue;
    balls.push({x:bx,z:bz,hx:bx,hz:bz,y:0.08+l*0.1,by:0.08+l*0.1,vx:0,vz:0,vy:0,c:cols[i++%7]});}}
function newToy(first){toy={x:rnd(-.35,.7),z:rnd(-.45,.35),y:first?BIN:2.0,vy:0,sq:0,yaw:rnd(-.4,.4),held:false,fall:false};}
// ---------- claw ----------
const HOME={x:0.35,z:0.1},TOPY=1.95,TS=1.25,HOFF=1.16;
const C={x:HOME.x,z:HOME.z,y:TOPY,open:0.15,st:'idle',t:0,held:false,grip:1,target:0};
let joy={id:null,dx:0,dy:0},keys={},btnDown=0;
function say(m){msg=m;msgT=2.4;}

let ac=null,whir=null;
function unlock(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),o2=ac.createOscillator(),f=ac.createBiquadFilter(),gn=ac.createGain();
  o.type='sawtooth';o.frequency.value=70;o2.type='square';o2.frequency.value=140.5;f.type='lowpass';f.frequency.value=600;gn.gain.value=0;
  o.connect(f);o2.connect(f);f.connect(gn).connect(ac.destination);o.start();o2.start();whir={gn,o};}catch(e){}}
function tone(f,d,type,vol,t0,f2){if(!ac)return;const t=ac.currentTime+(t0||0),o=ac.createOscillator(),gn=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  gn.gain.setValueAtTime(vol||.15,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn).connect(ac.destination);o.start(t);o.stop(t+d+.05);}
function noise(d,vol,fq){if(!ac)return;const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),gn=ac.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=fq||800;gn.gain.value=vol||.4;s.connect(f).connect(gn).connect(ac.destination);s.start();}
const sGrab=()=>{tone(320,.08,'square',.12,0,160);tone(200,.12,'triangle',.18,.05,90);noise(.08,.25,2000);};
const sClunk=()=>{tone(120,.25,'sine',.4,0,45);noise(.18,.6,500);};
const sJingle=()=>{[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.18,'square',.09,i*.11));};
const sBuzz=()=>tone(160,.25,'sawtooth',.08,0,90);
const sCoin=()=>{tone(988,.12,'square',.1);tone(1319,.3,'square',.1,.08);};
function setWhir(on,pitch){if(!whir)return;const t=ac.currentTime;whir.gn.gain.setTargetAtTime(on?.07:0,t,.05);whir.o.frequency.setTargetAtTime(pitch||70,t,.1);}
function inJoy(x,y){return Math.hypot(x-L.joy.x,y-L.joy.y)<L.joy.r*1.9&&y>L.ctrlY-20;}
function inBtn(x,y){return Math.hypot(x-L.btn.x,y-L.btn.y)<L.btn.r*1.4;}
function joyMove(x,y){let dx=(x-L.joy.x)/L.joy.r,dy=(y-L.joy.y)/L.joy.r;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;}joy.dx=dx;joy.dy=dy;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();const x=e.clientX,y=e.clientY;
  if(inBtn(x,y)){drop();return;}
  if(inJoy(x,y)&&joy.id===null){joy.id=e.pointerId;joy.active=true;joyMove(x,y);try{cv.setPointerCapture(e.pointerId);}catch(_){}} });
cv.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)joyMove(e.clientX,e.clientY);});
function jUp(e){if(e.pointerId===joy.id){joy.id=null;joy.active=false;joy.dx=joy.dy=0;}}
cv.addEventListener('pointerup',jUp);cv.addEventListener('pointercancel',jUp);
['touchstart','touchmove','gesturestart','dblclick','contextmenu'].forEach(t=>document.addEventListener(t,e=>{if(e.target===cv||t!=='touchstart')e.preventDefault();},{passive:false}));
addEventListener('keydown',e=>{unlock();keys[e.key]=1;if(e.key===' '||e.key==='Enter'){e.preventDefault();drop();}});
addEventListener('keyup',e=>{keys[e.key]=0;});
function circ(x,y,r,fill,lw){g.beginPath();g.arc(x,y,r,0,Math.PI*2);if(fill){g.fillStyle=fill;g.fill();}if(lw){g.lineWidth=lw;g.strokeStyle=OL;g.stroke();}}
function ell(x,y,rx,ry,fill,lw){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){g.fillStyle=fill;g.fill();}if(lw){g.lineWidth=lw;g.strokeStyle=OL;g.stroke();}}
function drop(){unlock();if(C.st!=='idle')return;if(credits<=0){say('OUT OF CREDITS');return;}credits--;C.st='down';C.t=0;btnDown=.25;sCoin();
  const d=Math.hypot(toy.x-C.x,toy.z-C.z);C.target=(!toy.fall&&toy.y<=BIN+.01&&d<0.34)?BIN+HOFF:0.62;}
// prong geometry: theta = splay angle of upper segment
function prongs(){const th=0.12+C.open*1.2,out=[];
  for(let k=0;k<3;k++){const a=k*2*Math.PI/3-Math.PI/2,D=[Math.cos(a),0,Math.sin(a)];
    const p0=[C.x+D[0]*.1,C.y-.08,C.z+D[2]*.1],p1=[p0[0]+D[0]*.5*Math.sin(th),p0[1]-.5*Math.cos(th),p0[2]+D[2]*.5*Math.sin(th)];
    const t2=th-1.35,p2=[p1[0]+D[0]*.28*Math.sin(t2),p1[1]-.28*Math.cos(t2),p1[2]+D[2]*.28*Math.sin(t2)];out.push([p0,p1,p2]);}return out;}
function update(dt){
  let mx=joy.dx,mz=joy.dy;if(keys.ArrowLeft||keys.a)mx=-1;if(keys.ArrowRight||keys.d)mx=1;if(keys.ArrowUp||keys.w)mz=-1;if(keys.ArrowDown||keys.s)mz=1;
  let moving=false;const lim=(v,m)=>Math.max(-m,Math.min(m,v));
  if(C.st==='idle'){C.open=Math.max(.0,C.open-dt);if(Math.abs(mx)>.08||Math.abs(mz)>.08){C.x=lim(C.x+mx*1.1*dt,CW-.3);C.z=lim(C.z+mz*1.1*dt,CD-.3);moving=true;}}
  else if(C.st==='down'){C.open=Math.min(1,C.open+dt*3);C.y-=dt*.8;moving=true;if(C.y<=C.target){C.y=C.target;C.st='close';C.t=0;sGrab();}}
  else if(C.st==='close'){C.t+=dt;const d=Math.hypot(toy.x-C.x,toy.z-C.z),over=C.target>1&&d<0.34;
    const stop=over?0.5:0;C.open=Math.max(stop,1-C.t*2.2);
    if(over&&C.open<=stop+.001&&!C.held){C.held=true;C.grip=1-d/0.34;toy.held=true;toy.sq=1;sGrab();}
    if(C.t>0.9)C.st='up';}
  else if(C.st==='up'){C.y+=dt*.8;moving=true;
    if(C.held&&C.y>1.4&&!C.slip){C.slip=1;if(Math.random()<.25*(1-C.grip)){C.held=false;toy.held=false;toy.vy=0;C.open=.5;sBuzz();say('Slipped! So close…');}}
    if(C.y>=TOPY){C.y=TOPY;C.slip=0;C.st=C.held?'carry':'ret';if(!C.held&&!msgT)say('Missed! Try again');}}
  else if(C.st==='carry'){moving=true;const dx=CHUTE.x-C.x,dz=CHUTE.z-C.z,d=Math.hypot(dx,dz),sp=.8*dt;
    if(d<=sp){C.x=CHUTE.x;C.z=CHUTE.z;C.st='release';C.t=0;}else{C.x+=dx/d*sp;C.z+=dz/d*sp;}}
  else if(C.st==='release'){C.t+=dt;C.open=Math.min(.8,C.open+dt*3);if(C.held&&C.t>.15){C.held=false;toy.held=false;toy.fall=true;toy.vy=0;}if(C.t>.7)C.st='ret';}
  else if(C.st==='ret'){moving=true;C.open=Math.max(0,C.open-dt*2);const dx=HOME.x-C.x,dz=HOME.z-C.z,d=Math.hypot(dx,dz),sp=.9*dt;
    if(d<=sp){C.x=HOME.x;C.z=HOME.z;C.st='idle';}else{C.x+=dx/d*sp;C.z+=dz/d*sp;}}
  setWhir(moving,C.st==='down'||C.st==='up'?55:75);
  // toy
  toy.sq=Math.max(0,toy.sq-dt*1.5);
  if(toy.held){toy.x=C.x;toy.z=C.z;toy.y=C.y-HOFF;toy.yaw=Math.sin(performance.now()/300)*.15;}
  else{toy.vy-=dt*6;toy.y+=toy.vy*dt;const floor=toy.fall?-1.2:BIN;
    if(toy.y<floor){toy.y=floor;if(toy.vy<-1.5&&!toy.fall){toy.vy*=-.3;sClunk();}else toy.vy=0;}
    if(toy.fall&&toy.y<-0.5&&!toy.done){toy.done=1;sClunk();shelf.push('monkey');wins++;setTimeout(sJingle,200);say('You won a Monkey!');setTimeout(()=>newToy(false),1200);}}
  // balls pushed by prongs/hub
  const pts=[];if(C.y<1.3)for(const p of prongs())pts.push(p[1],p[2]);if(!toy.held&&toy.vy<-1)pts.push([toy.x,toy.y,toy.z]);
  for(const b of balls){for(const q of pts){const dx=b.x-q[0],dz=b.z-q[2],dy=b.y-q[1],d=Math.hypot(dx,dz);if(d<.16&&Math.abs(dy)<.25&&d>0){b.vx+=dx/d*dt*14;b.vz+=dz/d*dt*14;if(b.y<=b.by+.001)b.vy=rnd(.6,1.4);}}
    b.vx+=(b.hx-b.x)*dt*4;b.vz+=(b.hz-b.z)*dt*4;b.vx*=.9;b.vz*=.9;b.x+=b.vx*dt;b.z+=b.vz*dt;b.vy-=dt*6;b.y+=b.vy*dt;if(b.y<b.by){b.y=b.by;b.vy=-b.vy*.35;if(Math.abs(b.vy)<.1)b.vy=0;}}
  if(msgT>0)msgT-=dt;if(btnDown>0)btnDown-=dt;}
// ---------- render helpers ----------
let Q=[];
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g2=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(k<1?v*k:v+(255-v)*(k-1))));return'rgb('+f(r)+','+f(g2)+','+f(b)+')';}
function sphere(x,y,z,r,col,o){const p=pr(x,y,z),rr=r*p.k;Q.push({z:p.z-r*(o&&o.bias||0),d:()=>{const gr=g.createRadialGradient(p.x-rr*.35,p.y-rr*.4,rr*.05,p.x,p.y,rr);gr.addColorStop(0,shade(col,1.35));gr.addColorStop(.55,col);gr.addColorStop(1,shade(col,.55));
  g.beginPath();g.arc(p.x,p.y,rr,0,7);g.fillStyle=gr;g.fill();if(!(o&&o.noline)){g.lineWidth=Math.max(1,rr*.08);g.strokeStyle='rgba(26,10,51,.85)';g.stroke();}}});}
function rod(a,b,w,col,bias){const p=pr(...a),q=pr(...b),k=(p.k+q.k)/2;Q.push({z:(p.z+q.z)/2-(bias||0),d:()=>{g.lineCap='round';g.strokeStyle=OL;g.lineWidth=w*k+3;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(q.x,q.y);g.stroke();
  g.strokeStyle=col;g.lineWidth=w*k;g.stroke();g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=Math.max(1,w*k*.3);g.beginPath();g.moveTo(p.x-w*k*.15,p.y-w*k*.15);g.lineTo(q.x-w*k*.15,q.y-w*k*.15);g.stroke();}});}
function poly(pts,col,z,a){const P2=pts.map(p=>pr(...p));const zz=z!=null?z:P2.reduce((s,p)=>s+p.z,0)/P2.length;Q.push({z:zz,d:()=>{g.beginPath();P2.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.globalAlpha=a==null?1:a;g.fillStyle=col;g.fill();g.globalAlpha=1;g.lineWidth=1.5;g.strokeStyle='rgba(26,10,51,.6)';g.stroke();}});}
function flushQ(){Q.sort((a,b)=>b.z-a.z);for(const q of Q)q.d();Q=[];}
function lit(n){return .55+.6*Math.max(0,dot(n,LIGHT));}
// box with shaded faces (only faces toward camera)
function box(cx,cy,cz,hx,hy,hz,col){const V=(sx,sy,sz)=>[cx+sx*hx,cy+sy*hy,cz+sz*hz];
  const faces=[[[0,1,0],[V(-1,1,-1),V(1,1,-1),V(1,1,1),V(-1,1,1)]],[[0,0,1],[V(-1,-1,1),V(1,-1,1),V(1,1,1),V(-1,1,1)]],[[1,0,0],[V(1,-1,-1),V(1,1,-1),V(1,1,1),V(1,-1,1)]],[[-1,0,0],[V(-1,-1,-1),V(-1,1,-1),V(-1,1,1),V(-1,-1,1)]],[[0,-1,0],[V(-1,-1,-1),V(1,-1,-1),V(1,-1,1),V(-1,-1,1)]]];
  const c=pr(cx,cy,cz).z;for(const [n,f] of faces){const fc=[cx+n[0]*hx,cy+n[1]*hy,cz+n[2]*hz];if(dot(n,sub(CAM.e,fc))<=0)continue;poly(f,shade(col,lit(n)),c-.001);}}
// ---------- monkey (built from shaded spheres) ----------
const FUR='#b8743a',SKIN='#f6d2a2';
function monkey(x,y,z,s,sq,yaw){const sx=1+sq*.12,sy=1-sq*.14,cy=Math.cos(yaw),sn=Math.sin(yaw);
  const P3=(a,b,c)=>[x+(a*cy+c*sn)*s*sx,y+b*s*sy,z+(-a*sn+c*cy)*s*sx];const S=(a,b,c,r,col,bias)=>{const q=P3(a,b,c);sphere(q[0],q[1],q[2],r*s,col,{bias:bias||0});};
  for(let i=0;i<9;i++){const t=i/8,ang=t*4.2;S(.05+Math.sin(ang)*.12*t+.1*t,.12+t*.3+Math.cos(ang)*.1*t,-.22-t*.12,.045,FUR);} // curly tail
  S(0,.22,0,.24,FUR);S(0,.2,.13,.15,SKIN,.05);
  for(const k of[-1,1]){S(k*.15,.05,.14,.1,FUR,.02);S(k*.17,.03,.22,.065,SKIN,.06);S(k*.24,.3,.06,.085,FUR,.02);S(k*.3,.17,.14,.07,SKIN,.04);}
  S(0,.56,0,.22,FUR);for(const k of[-1,1]){S(k*.22,.6,-.02,.09,FUR,-.02);S(k*.23,.6,.02,.055,SKIN,.02);}
  S(0,.5,.13,.14,SKIN,.06);for(const k of[-1,1]){S(k*.075,.62,.15,.07,SKIN,.07);S(k*.075,.62,.2,.042,'#ffffff',.11);S(k*.07,.62,.235,.022,'#1a0f08',.14);}
  S(0,.47,.25,.025,'#5a2c10',.14);
  const m=pr(...P3(0,.43,.26));Q.push({z:m.z-.2*s,d:()=>{g.strokeStyle='#4a200a';g.lineWidth=Math.max(1.5,.02*s*m.k);g.lineCap='round';g.beginPath();g.arc(m.x,m.y-.03*s*m.k,.06*s*m.k,.4,Math.PI-.4);g.stroke();}});}
function floorEll(x,z,r,a){const c=pr(x,BIN+.01,z),e=pr(x+r,BIN+.01,z),f=pr(x,BIN+.01,z+r);g.globalAlpha=a;g.fillStyle='#0a0418';g.beginPath();g.ellipse(c.x,c.y,Math.abs(e.x-c.x),Math.max(1,Math.abs(f.y-c.y)),0,0,7);g.fill();g.globalAlpha=1;}
function quad2(pts,fill){const P2=pts.map(p=>pr(...p));g.beginPath();P2.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.fillStyle=fill;g.fill();return P2;}
function drawScene(t){
  // interior shell
  const bk=quad2([[-CW,0,-CD],[CW,0,-CD],[CW,CHT,-CD],[-CW,CHT,-CD]],'#3a2380');
  const gl=g.createRadialGradient((bk[0].x+bk[1].x)/2,bk[2].y,10,(bk[0].x+bk[1].x)/2,bk[2].y,(bk[1].x-bk[0].x));gl.addColorStop(0,'rgba(255,230,255,.55)');gl.addColorStop(1,'rgba(255,230,255,0)');
  quad2([[-CW,0,-CD],[CW,0,-CD],[CW,CHT,-CD],[-CW,CHT,-CD]],gl);
  g.strokeStyle='rgba(255,255,255,.07)';g.lineWidth=2;for(let i=1;i<10;i++){const a=pr(-CW+i*CW/5,0,-CD),b=pr(-CW+i*CW/5,CHT,-CD);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();}
  quad2([[-CW,0,-CD],[-CW,0,CD],[-CW,CHT,CD],[-CW,CHT,-CD]],'#2c1a66');quad2([[CW,0,-CD],[CW,0,CD],[CW,CHT,CD],[CW,CHT,-CD]],'#24145a');
